<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app-container">

        <!-- Header -->
        <header class="chat-header">
            <div class="bot-profile">
                <div class="bot-icon">🤖</div>

                <div class="bot-info">
                    <h2>AI Assistant</h2>
                    <p>
                        <span class="online-dot"></span>
                        Online
                    </p>
                </div>
            </div>

            <button id="clear-chat" class="clear-btn">
                Clear Chat
            </button>
        </header>


        <!-- Chat Area -->
        <main class="chat-area" id="chat-box">

            <div class="welcome-message">
                <div class="welcome-icon">🤖</div>

                <h2>Hello! Welcome</h2>

                <p>
                    I am your AI chatbot assistant.
                    How can I help you today?
                </p>
            </div>

            <div class="message bot-message">
                <div class="message-icon">🤖</div>

                <div class="message-content">
                    Hello! How can I help you?
                </div>
            </div>

        </main>


        <!-- Suggested Questions -->
        <section class="suggestions">
            <button class="suggestion-btn"
                data-message="Hello">
                Hello
            </button>

            <button class="suggestion-btn"
                data-message="What is Python?">
                What is Python?
            </button>

            <button class="suggestion-btn"
                data-message="Tell me about HTML">
                About HTML
            </button>
        </section>


        <!-- Message Input -->
        <footer class="chat-footer">

            <div class="input-container">

                <input
                    type="text"
                    id="message"
                    placeholder="Ask me anything..."
                    autocomplete="off"
                >

                <button id="send-btn" type="button">
                    Send ➤
                </button>

            </div>

            <p class="footer-text">
                AI Chatbot | Made with HTML, CSS & JavaScript
            </p>

        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
